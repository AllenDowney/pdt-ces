# The dataset, its terms and its releases (STANDARD.md §2.1, §8).
# Schema: PublicDataToolkit/schema/dataset.schema.json. Edited by hand.
standard_version: "0.1"
id: ces
title: "Cooperative Election Study (CES)"
publisher:
  name: "Cooperative Election Study (Harvard Dataverse)"
  url: "https://cces.gov.harvard.edu/"
url: "https://dataverse.harvard.edu/dataverse/cces"
description: "A large online survey of U.S. adults about elections and politics, run by YouGov since 2006 (as the CCES until 2020), with a common-content file per year and a cumulative file that harmonizes the years."
# Terms are decided by a person, never by an agent or this template (STANDARD.md §8).
# Quote what the terms pages say in `summary`, then have a person set each field
# to ship or build-only and fill reviewed_by and reviewed_on. `unknown` blocks
# shipping anything that depends on it.
terms:
  url: "https://creativecommons.org/publicdomain/zero/1.0/"
  summary: >-
    What the sources say: each Dataverse dataset used here
    (Cumulative CES Common Content, doi:10.7910/DVN/II2DB6, and the Common Content of 2020,
    2022 and 2024, doi:10.7910/DVN/E9N6PH, PR4L8P and X11EP6) shows the license "CC0 1.0"
    in its Dataverse metadata, with no custom terms of use. The cumulative file's build code
    (github.com/kuriwaki/cces_cumulative) has no license file; this repo reads it for the
    variable mapping and doesn't redistribute it.
  data: ship
  documentation: ship
  metadata: ship
  llm_processing: allowed
  reviewed_by: Allen Downey
  reviewed_on: '2026-11-20'
  notice: "Source: Cooperative Election Study (CES), Common Content 2020, 2022 and 2024, and the Cumulative CES Common Content, Harvard Dataverse, released under CC0 1.0."
dimensions:
  wave:
    label: "year"
    column: year
    note: The year of the study. A cumulative-file row's wave is its `year`.
releases:
  - id: "cumulative"
    label: "Cumulative CES Common Content, 2006-2025 (Dataverse version 12.0)"
    date: "2026-07-14"
    status: current
    sources: [cumulative-dta, cumulative-guide, cumulative-build-read, cumulative-build-functions, cumulative-build-stack]
    tables:
      - id: cumulative
        label: "The cumulative common content (cumulative_2006-2025.dta), one row per respondent per year"
        sources: [cumulative-dta]
        key: [year, case_id]
    design:
      weights: [weight, weight_cumulative]
      note: >
        The guide: weight is each year's survey weight; weight_cumulative is weight divided by a
        constant within each year, to make years comparable. The cumulative file has no strata or
        PSU variables. Not in this slice: weight_post, vvweight, vvweight_post.
  - id: "2020"
    label: "Cooperative Election Study Common Content, 2020 (Dataverse version 4.0)"
    status: current
    sources: [ces2020-dta, ces2020-guide]
    tables:
      - id: common
        label: "The 2020 common content (CES20_Common_OUTPUT_vv.dta)"
        sources: [ces2020-dta]
        key: [caseid]
    design:
      weights: [commonweight]
  - id: "2022"
    label: "Cooperative Election Study Common Content, 2022 (Dataverse version 4.0)"
    status: current
    sources: [ces2022-dta, ces2022-guide]
    tables:
      - id: common
        label: "The 2022 common content (CCES22_Common_OUTPUT_vv_topost.dta)"
        sources: [ces2022-dta]
        key: [caseid]
    design:
      weights: [commonweight]
  - id: "2024"
    label: "Cooperative Election Study Common Content, 2024 (Dataverse version 9.0)"
    status: current
    sources: [ces2024-dta, ces2024-guide]
    tables:
      - id: common
        label: "The 2024 common content (CCES24_Common_OUTPUT_vv_topost_final.dta)"
        sources: [ces2024-dta]
        key: [caseid]
    design:
      weights: [commonweight]
