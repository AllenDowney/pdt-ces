      Notes: Limitations: Response options vary by year. Some are collapsed into one category (e.g., Gotten Better, presented in some years, and Gotten Somewhat Better, presented in other years, are collapsed into Gotten Better / Somewhat Better). Some are left as is. For example, Not Sure was not an option in 2009.

