  - name: race
    label: Race
    description: “What racial or ethnic group best describes you?”
    type: number(id)
    examples:
    - 1
    - 3
    - 5
    - 6
    - 8
    details: |
      Codes: 1 = White; 2 = Black; 3 = Hispanic; 4 = Asian; 5 = Native American; 6 = Mixed; 7 = Other; 8 = Middle Eastern

      Notes: Limitations: The “Hispanic” value may undercount self-identified Hispanics. See hispanic and race_h.

      Available: 2006-2025 (all)
  - name: hispanic
    label: Hispanic
    description: “Are you of Spanish, Latino, or Hispanic origin or descent? [Asked if response to race
      is not Hispanic]”
    type: number(id)
    examples:
    - 1
    - 2
    details: |
      Codes: 1 = Yes; 2 = No

      Notes: Different years have treated this question differently. Until 2017, this question was not asked to those who responded “Hispanic” in the race question. From 2018-2022, this question was asked to all respondents. From 2024, the value of these questions for all those who said they were Hispanic appear to have been set to Yes. For a combined version of race and hispanic, see race_h (any-part Hispanic), which is more stable version.

      See hisp_origin for more details on hispanic origin

      Available: 2010-2025
