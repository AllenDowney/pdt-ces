  - name: faminc
    label: Family Income
    description: “Thinking back over the last year, what was your family’s annual income? [Brackets coarsened]”
    type: number(ordinal)
    range:
    - 1
    - 12
    details: |
      Codes: 1 = Less than 10k; 2 = 10k - 20k; 3 = 20k - 30k; 4 = 30k - 40k; 5 = 40k - 50k; 6 = 50k - 60k; 7 = 60k - 70k; 8 = 70k - 80k; 9 = 80k - 100k; 10 = 100k - 120k; 11 = 120k - 150k; 12 = 150k+

      Notes: Limitations: The income brackets provided changed slightly over time. The brackets in this cumulative dataset coarsen certain original brackets, losing some granularity. In particular, from 2011-2016, respondents answering “over 150k” were asked a follow-up question to se- lect one of several brackets above 150k. Here, these are top-coded and only labelled as “over 150k.”

      The 2009 CCES did not have an option for 60-70k.

      Available: 2006-2025 (all)
