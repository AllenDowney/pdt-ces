name: ces
label: Cooperative Election Study (CES)
description: A large online survey of U.S. adults about elections and politics, run by YouGov since 2006
  (as the CCES until 2020), with a common-content file per year and a cumulative file that harmonizes
  the years.
details: |
  Publisher: Cooperative Election Study (Harvard Dataverse) (https://cces.gov.harvard.edu/)

  Release `cumulative`: Cumulative CES Common Content, 2006-2025 (Dataverse version 12.0) (current)

  Terms of use: https://creativecommons.org/publicdomain/zero/1.0/

  Exported by the PublicDataToolkit library 0.1.0 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
