  - name: weight
    label: Survey weight (Year-Specific)
    description: '[weights for pre-election survey of each year]'
    type: number(quantity)
    range:
    - 0
    - 15.0614388091749
    details: |
      Notes: In even years, they are re-computed after vote validation has been computed and those re-computed weights are taken here when available. The weights applied to the sample (which is originally drawn from a matched sample) are constructed to make each year’s data representative of the national adult population. See the methodology section of the 2016 Guide and the FAQ on the CCES website for details.

      Limitations: Only specific to each year. Built off of the entire pre-election wave sample, but not necessarily to adjust post-election wave respondents. See weight_post

      Available: 2006-2025 (all)
  - name: weight_cumulative
    label: Survey weight (Cumulative)
    description: '[weight variable with simple adjustment: multiplied a constant within year to make years
      compara- ble]'
    type: number(quantity)
    range:
    - 0
    - 24.3028788022879
    details: |
      Notes: Limitations: Only a simple transformation of weight. Specifically, weight_cumulative is weight divided by the year-specific factors shown in the following table. For example, all weights in the 2016 common content are divided by about 2.21, because it has about twice as many observations as the other datasets.

      Therefore, this cumulative weight simply re-weights all years to have the same sample size. This means that, if both odd years and even years are included in the weighted average, every even-year observation is down-weighted by a factor of about 2. For analyses that are done year by year, using weight and weight_cumulative are equivalent.

      Available: 2006-2025 (all)
  - name: gender
    label: Sex (standardized)
    description: “Are you. . . ? <1> Male <2> Female [2018-2020] Are you male or female? [2006-2016]”
    type: number(id)
    examples:
    - 1
    - 2
    details: |
      Codes: 1 = Male; 2 = Female

      Notes: Although named gender historically, this question’s wording is such that it asks people’s sex. Until 2020, only two choices were allowed. From 2021, the question was discontinued in favor of the question now called gender4 (see below).

      The cumulative file has, as of V8, kept the gender variable and relabelled it as a “standard- ized” binary variable for all years by making the following custom recodes for 2021 onwards: Man in gender4 is recoded to Male, Woman in gender4 is recoded to Female, and other categories are coded as missing.

      The cumulative file has created a variable sex to more accurately capture what the gender question has asked 2006–2020 (see below).

      Some years ask respondents if they identify as transsexual. These are currently not included in the cumulative common content.

      Available: 2006-2025 (all)
