  - name: intent_turnout_self
    label: Self-reported turnout (pre-election wave)
    description: '“2020: Do you intend to vote in the 2020 general election on November 3rd?”'
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 5
    - 6
    details: |
      Codes: 1 = Yes, definitely; 2 = Probably; 3 = I already voted (early or absentee); 4 = I plan to vote before Election Day; 5 = No; 6 = Undecided

      Notes: Limitations: Collapses and simplifies response categories to standardize across years. See individual year’s datasets for details. Some response categories are still not standardized. For example, “I plan to vote before Election Day” is unavailable in 2016. Additionally, the question is available in years 2010 and earlier but not included in this version of the cumulative dataset because those years rely on a 2006–2012 cumulative release.

      Available: 2012,2014,2016,2018,2020,2022,2024 (not 6 waves)
