    version: 0fd71dbb5523a2795d57c3b2081b818acffd567c
    releases: ["cumulative"]
    documents: ["cumulative"]
    redistribution: unknown
    acquisition: automated
    note: >
      The cumulative file's own build code, by its author, linked from the guide as its
      "source code repository". The repository has no license file. Its renames and recodes
      are the source for this repo's derived_from links.
