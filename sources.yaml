# Every file this repo depends on (STANDARD.md §2.2): data files, codebooks,
# questionnaires, release notes, errata and terms pages, upstream packages.
# Schema: PublicDataToolkit/schema/sources.schema.json. Edited by hand.
#
# Once a file is fetched, fill fetched_on, bytes and sha256 (pdt check C6).
# Dataverse files are fetched by file id through the access API.
sources:
  - id: cumulative-dta
    title: "Cumulative CES Common Content, 2006-2025 (Dataverse version 12.0), Stata file"
    kind: data
    format: stata
    url: "https://dataverse.harvard.edu/api/access/datafile/14076515"
    path: data/raw/cumulative_2006-2025.dta
    releases: ["cumulative"]
    redistribution: unknown
    acquisition: automated
  - id: cumulative-guide
    title: "Guide to the Cumulative Common Content of the Cooperative (Congressional) Election Study, 2026-07-14 (Kuriwaki)"
    kind: codebook
    format: pdf
    url: "https://dataverse.harvard.edu/api/access/datafile/14076560"
    path: data/raw/guide_cumulative_2006-2025.txt
    convert: "pdftotext -layout (poppler 24.02)"
    releases: ["cumulative"]
    documents: ["cumulative"]
    redistribution: unknown
    acquisition: automated
  - id: cumulative-build-read
    title: "cces_cumulative build code: 03_read-common.R (reads each year's file and its case id)"
    kind: crosswalk
    format: R
    url: "https://raw.githubusercontent.com/kuriwaki/cces_cumulative/0fd71dbb5523a2795d57c3b2081b818acffd567c/03_read-common.R"
